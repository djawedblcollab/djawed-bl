<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Où sont mes clients? - Dashboard Djawed BL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1rem;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        
        .stat-number {
            font-size: 3rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .stat-label {
            font-size: 1.1rem;
            color: #666;
            font-weight: 600;
        }
        
        .stat-detail {
            font-size: 0.9rem;
            color: #999;
            margin-top: 10px;
        }
        
        .main-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .section-title {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
            font-size: 1.8rem;
        }
        
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .filter-btn:hover {
            background: #667eea;
            color: white;
        }
        
        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #764ba2;
        }
        
        .search-box {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
        }
        
        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .client-grid {
            display: grid;
            gap: 15px;
        }
        
        .client-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            border-left: 5px solid #667eea;
            transition: all 0.3s;
        }
        
        .client-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateX(5px);
        }
        
        .client-card.contacted {
            border-left-color: #28a745;
            background: #f0f9f4;
        }
        
        .client-card.pending {
            border-left-color: #ffc107;
            background: #fffbf0;
        }
        
        .client-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .client-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: #333;
        }
        
        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .status-badge.contacted {
            background: #28a745;
            color: white;
        }
        
        .status-badge.pending {
            background: #ffc107;
            color: #000;
        }
        
        .client-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .info-icon {
            font-size: 1.2rem;
        }
        
        .info-text {
            color: #666;
        }
        
        .info-label {
            font-weight: 600;
            color: #333;
        }
        
        .no-results {
            text-align: center;
            padding: 60px;
            color: #999;
            font-size: 1.2rem;
        }
        
        .industry-chart {
            margin: 30px 0;
        }
        
        .industry-bar {
            margin-bottom: 15px;
        }
        
        .industry-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        
        .bar-container {
            background: #e0e0e0;
            height: 30px;
            border-radius: 15px;
            overflow: hidden;
        }
        
        .bar-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            border-radius: 15px;
            transition: width 0.5s;
            display: flex;
            align-items: center;
            padding: 0 15px;
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .export-btn {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        
        .export-btn:hover {
            transform: translateY(-2px);
        }
        
        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }
        
        .refresh-btn:hover {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Où sont mes clients?</h1>
            <p class="subtitle">Dashboard de suivi des prospects - Djawed BL</p>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-number" id="totalClients">0</div>
                <div class="stat-label">Total Prospects</div>
                <div class="stat-detail">Base de données complète</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-number" id="contactedClients">0</div>
                <div class="stat-label">Contactés</div>
                <div class="stat-detail" id="contactedPercent">0%</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">⏳</div>
                <div class="stat-number" id="pendingClients">0</div>
                <div class="stat-label">En attente</div>
                <div class="stat-detail" id="pendingPercent">0%</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">🏢</div>
                <div class="stat-number" id="industriesCount">0</div>
                <div class="stat-label">Secteurs</div>
                <div class="stat-detail">Industries ciblées</div>
            </div>
        </div>
        
        <div class="main-content">
            <h2 class="section-title">📈 Répartition par Secteur</h2>
            <div id="industryChart" class="industry-chart"></div>
            
            <h2 class="section-title">🔍 Rechercher et Filtrer</h2>
            
            <input 
                type="text" 
                id="searchBox" 
                class="search-box" 
                placeholder="🔍 Rechercher par nom, email, secteur ou notes..."
            >
            
            <div class="filters">
                <button class="filter-btn active" data-filter="all">Tous</button>
                <button class="filter-btn" data-filter="contacted">✅ Contactés</button>
                <button class="filter-btn" data-filter="pending">⏳ En attente</button>
            </div>
            
            <div id="clientGrid" class="client-grid"></div>
            
            <button class="export-btn" onclick="exportData()">📥 Exporter en CSV</button>
        </div>
    </div>
    
    <button class="refresh-btn" onclick="loadClients()" title="Actualiser">🔄</button>
    
    <script>
        let allClients = [];
        let currentFilter = 'all';
        
        // Load clients from prospects.json
        async function loadClients() {
            try {
                // Try to load from the actual file
                const response = await fetch('prospects.json');
                if (response.ok) {
                    allClients = await response.json();
                } else {
                    // Fallback to localStorage
                    const saved = localStorage.getItem('prospects');
                    if (saved) {
                        allClients = JSON.parse(saved);
                    } else {
                        // Default data
                        allClients = [
                            {
                                id: 1,
                                company: "Example Tech Company",
                                email: "contact@example.com",
                                industry: "Technology",
                                contacted: false,
                                notes: "Potential client for corporate video editing"
                            },
                            {
                                id: 2,
                                company: "Marketing Agency XYZ",
                                email: "hello@marketingagency.com",
                                industry: "Marketing",
                                contacted: false,
                                notes: "May need social media content creation"
                            },
                            {
                                id: 3,
                                company: "E-commerce Brand",
                                email: "info@ecommercebrand.com",
                                industry: "E-commerce",
                                contacted: false,
                                notes: "Product video editing services"
                            }
                        ];
                    }
                }
                updateDisplay();
            } catch (err) {
                console.error('Erreur de chargement:', err);
                // Use localStorage as fallback
                const saved = localStorage.getItem('prospects');
                if (saved) {
                    allClients = JSON.parse(saved);
                    updateDisplay();
                }
            }
        }
        
        // Update all displays
        function updateDisplay() {
            updateStats();
            updateIndustryChart();
            displayClients();
        }
        
        // Update statistics
        function updateStats() {
            const total = allClients.length;
            const contacted = allClients.filter(c => c.contacted).length;
            const pending = allClients.filter(c => !c.contacted).length;
            
            // Count unique industries
            const industries = new Set(allClients.map(c => c.industry || 'Non spécifié'));
            
            document.getElementById('totalClients').textContent = total;
            document.getElementById('contactedClients').textContent = contacted;
            document.getElementById('pendingClients').textContent = pending;
            document.getElementById('industriesCount').textContent = industries.size;
            
            const contactedPercent = total > 0 ? Math.round(contacted / total * 100) : 0;
            const pendingPercent = total > 0 ? Math.round(pending / total * 100) : 0;
            
            document.getElementById('contactedPercent').textContent = contactedPercent + '% du total';
            document.getElementById('pendingPercent').textContent = pendingPercent + '% du total';
        }
        
        // Update industry chart
        function updateIndustryChart() {
            const byIndustry = {};
            allClients.forEach(c => {
                const industry = c.industry || 'Non spécifié';
                if (!byIndustry[industry]) {
                    byIndustry[industry] = { total: 0, contacted: 0 };
                }
                byIndustry[industry].total++;
                if (c.contacted) {
                    byIndustry[industry].contacted++;
                }
            });
            
            const chartEl = document.getElementById('industryChart');
            const total = allClients.length;
            
            chartEl.innerHTML = Object.keys(byIndustry).sort().map(industry => {
                const stats = byIndustry[industry];
                const percent = total > 0 ? Math.round(stats.total / total * 100) : 0;
                return `
                    <div class="industry-bar">
                        <div class="industry-label">
                            <span>${industry}</span>
                            <span>${stats.total} prospects (${percent}%)</span>
                        </div>
                        <div class="bar-container">
                            <div class="bar-fill" style="width: ${percent}%">
                                ✅ ${stats.contacted} contactés
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // Display clients
        function displayClients() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            
            let filtered = allClients;
            
            // Apply filter
            if (currentFilter === 'contacted') {
                filtered = filtered.filter(c => c.contacted);
            } else if (currentFilter === 'pending') {
                filtered = filtered.filter(c => !c.contacted);
            }
            
            // Apply search
            if (searchTerm) {
                filtered = filtered.filter(c => {
                    return (c.company || '').toLowerCase().includes(searchTerm) ||
                           (c.email || '').toLowerCase().includes(searchTerm) ||
                           (c.industry || '').toLowerCase().includes(searchTerm) ||
                           (c.notes || '').toLowerCase().includes(searchTerm);
                });
            }
            
            const gridEl = document.getElementById('clientGrid');
            
            if (filtered.length === 0) {
                gridEl.innerHTML = '<div class="no-results">😔 Aucun prospect trouvé</div>';
                return;
            }
            
            gridEl.innerHTML = filtered.map(client => {
                const status = client.contacted ? 'contacted' : 'pending';
                const statusText = client.contacted ? '✅ Contacté' : '⏳ En attente';
                const dateInfo = client.contactedDate 
                    ? `le ${new Date(client.contactedDate).toLocaleDateString('fr-FR')}` 
                    : '';
                
                return `
                    <div class="client-card ${status}">
                        <div class="client-header">
                            <div class="client-name">${client.company}</div>
                            <span class="status-badge ${status}">${statusText}</span>
                        </div>
                        <div class="client-info">
                            <div class="info-item">
                                <span class="info-icon">📧</span>
                                <div>
                                    <div class="info-label">Email</div>
                                    <div class="info-text">${client.email}</div>
                                </div>
                            </div>
                            <div class="info-item">
                                <span class="info-icon">🏢</span>
                                <div>
                                    <div class="info-label">Secteur</div>
                                    <div class="info-text">${client.industry || 'Non spécifié'}</div>
                                </div>
                            </div>
                            ${dateInfo ? `
                            <div class="info-item">
                                <span class="info-icon">📅</span>
                                <div>
                                    <div class="info-label">Contacté</div>
                                    <div class="info-text">${dateInfo}</div>
                                </div>
                            </div>
                            ` : ''}
                            ${client.notes ? `
                            <div class="info-item" style="grid-column: 1 / -1;">
                                <span class="info-icon">📝</span>
                                <div>
                                    <div class="info-label">Notes</div>
                                    <div class="info-text">${client.notes}</div>
                                </div>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // Export to CSV
        function exportData() {
            const csv = [
                ['Entreprise', 'Email', 'Secteur', 'Statut', 'Date de contact', 'Notes'].join(','),
                ...allClients.map(c => [
                    `"${c.company}"`,
                    `"${c.email}"`,
                    `"${c.industry || ''}"`,
                    c.contacted ? 'Contacté' : 'En attente',
                    c.contactedDate ? new Date(c.contactedDate).toLocaleDateString('fr-FR') : '',
                    `"${(c.notes || '').replace(/"/g, '""')}"`
                ].join(','))
            ].join('\n');
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `clients-djawed-bl-${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }
        
        // Event listeners
        document.getElementById('searchBox').addEventListener('input', displayClients);
        
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                displayClients();
            });
        });
        
        // Load on page load
        loadClients();
    </script>
</body>
</html>
